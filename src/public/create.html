<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フォーム作成 | SecPro Workshop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
  </style>
</head>
<body class="bg-[#f0ebf8] min-h-screen">
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-purple-700 font-medium">SecPro Forms — 作成</span>
        <span id="mode-badge" class="px-3 py-1 rounded-full text-white text-xs font-bold bg-gray-400">...</span>
      </div>
      <nav class="flex gap-4 text-sm text-purple-700">
        <a href="/">回答</a>
        <a href="/create.html" class="font-medium underline">作成</a>
        <a href="/admin.html">管理</a>
        <a href="/challenges.html" class="font-bold">演習シート</a>
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto mt-6 mb-12 px-4">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="h-2 bg-purple-600"></div>
      <div class="p-8">
        <h1 class="text-2xl text-gray-800 mb-6">新しいフォームを作成</h1>

        <form id="create-form" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">タイトル</label>
            <input type="text" id="form-title-input" required
              class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-purple-500"
              placeholder="アンケートのタイトル">
          </div>

          <div id="questions-list" class="space-y-4"></div>

          <button type="button" id="add-question-btn"
            class="text-purple-700 text-sm font-medium hover:underline">
            + 設問を追加
          </button>

          <div class="pt-4">
            <button type="submit"
              class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700">
              フォームを作成
            </button>
          </div>
        </form>

        <div id="result" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded text-green-800 text-sm"></div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/create.js"></script>
</body>
</html>
