<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>演習シート | SecPro Workshop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
  </style>
</head>
<body class="bg-[#f0ebf8] min-h-screen">
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-purple-700 font-medium">SecPro Workshop</span>
        <span id="mode-badge" class="px-3 py-1 rounded-full text-white text-xs font-bold bg-gray-400">...</span>
      </div>
      <nav class="flex gap-4 text-sm text-purple-700">
        <a href="/">回答</a>
        <a href="/create.html">作成</a>
        <a href="/admin.html">管理</a>
        <a href="/challenges.html" class="font-bold underline">演習シート</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto mt-6 mb-12 px-4">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 mb-6">
      <h1 class="text-3xl text-gray-800 mb-2">演習シート</h1>
      <p class="text-gray-600 text-sm mb-4">
        3つの脆弱性を突いて <strong>〇〇-OK!!</strong> スタンプを集めよう。
        この環境では <span id="nav-mode" class="font-medium">...</span> です。
      </p>
      <div id="progress-bar" class="flex items-center gap-3">
        <span class="text-sm text-gray-500">進捗:</span>
        <span id="progress-text" class="px-3 py-1 bg-purple-100 text-purple-800 rounded-full text-sm font-bold">0/3 達成</span>
      </div>
      <div id="all-clear" class="hidden mt-4 p-4 bg-yellow-100 border-2 border-yellow-400 rounded-lg text-center">
        <p class="text-xl font-bold text-yellow-800">この環境クリア！！</p>
        <p class="text-sm text-yellow-700 mt-1">3スタンプ全部取得しました。もう片方の環境も試してみよう！</p>
      </div>
    </div>

    <div id="challenges-list" class="space-y-4"></div>

    <div class="mt-8 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
      <h2 class="text-lg font-medium text-gray-800 mb-3">スタンプ登録</h2>
      <p class="text-sm text-gray-500 mb-3">見つけたスタンプを入力して確認しよう</p>
      <div class="flex gap-2">
        <input type="text" id="stamp-input" placeholder="見つけたスタンプを入力"
          class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm">
        <button id="register-stamp-btn"
          class="bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700">
          確認
        </button>
      </div>
      <p id="verify-feedback" class="hidden mt-3 text-sm font-bold"></p>
      <ul id="collected-stamps" class="mt-4 space-y-1 text-sm text-gray-700"></ul>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/challenges.js"></script>
</body>
</html>
