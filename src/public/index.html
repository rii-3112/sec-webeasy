<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート回答 | SecPro Workshop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
  </style>
</head>
<body class="bg-[#f0ebf8] min-h-screen">
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-purple-700 font-medium">SecPro Forms</span>
        <span id="mode-badge" class="px-3 py-1 rounded-full text-white text-xs font-bold bg-gray-400">...</span>
      </div>
      <nav class="flex gap-4 text-sm text-purple-700">
        <a href="/" class="font-medium underline">回答</a>
        <a href="/create.html">作成</a>
        <a href="/admin.html">管理</a>
        <a href="/challenges.html" class="font-bold">演習シート</a>
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto mt-6 mb-12 px-4">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="h-2 bg-purple-600"></div>
      <div class="p-8 pb-4">
        <h1 id="form-title" class="text-3xl font-normal text-gray-800">読み込み中...</h1>
        <p id="form-desc" class="text-sm text-gray-500 mt-2">Google フォーム風アンケート（ワークショップ用）</p>
      </div>
    </div>

    <form id="survey-form" class="mt-3 space-y-3"></form>

    <div id="submit-area" class="mt-4 flex items-center gap-4">
      <button type="submit" form="survey-form" id="submit-btn"
        class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition disabled:opacity-50">
        送信
      </button>
      <p id="status-msg" class="text-sm text-gray-600"></p>
    </div>

    <div id="already-submitted" class="hidden mt-6 bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-yellow-800 text-sm">
      このフォームにはすでに回答済みです（1人1回まで）。
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/form.js"></script>
</body>
</html>
